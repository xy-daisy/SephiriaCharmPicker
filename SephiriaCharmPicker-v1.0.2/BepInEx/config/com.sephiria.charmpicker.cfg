## Settings file was created by plugin Sephiria Charm Picker v1.0.2
## Plugin GUID: com.sephiria.charmpicker

[Button]

## Text on the extra button next to the sapphire restock button. Any text works; leave empty to keep whatever the clone came with.
# Setting type: String
# Default value: 自选
Label = 自选

## Which side of the restock button to place it on when the parent has no layout group: Left, Right, Up or Down. Renamed from the old "Position" key so the new default actually applies - a changed default never overwrites a value already written to this file. The log line "[SCP] pickbutton:" prints the final rect, so a nudge can be checked against numbers instead of a screenshot.
# Setting type: String
# Default value: Down
Placement = Down

## Pixels between the restock button and this one.
# Setting type: Single
# Default value: 8
Gap = 8

## Extra horizontal nudge, applied after Placement. Positive is right.
# Setting type: Single
# Default value: 0
OffsetX = 0

## Extra vertical nudge, applied after Placement. Positive is up.
# Setting type: Single
# Default value: 0
OffsetY = 0

## Draw the button above its siblings inside the shop's button container, so nothing in there can cover it.
# Setting type: Boolean
# Default value: true
DrawOnTop = true

## What the cloned button's inherited artwork becomes. The restock button is not just a frame and a label: it carries a framed "?" icon and a sapphire gem in its price row, and both survived on the clone (only the price NUMBER could be cleared, because that one is text). Solid HIDES those two graphics, leaving the game's own frame and this mod's label - it does not repaint them, because the frame's dark pixels live in its sprite (its Image colour is white), so "the button's background colour" cannot be measured and the first attempt painted them white. Keep leaves the game's artwork alone and keeps the label's inherited colour with it.
# Setting type: String
# Default value: Solid
Look = Solid

[General]

## Master switch. While false the extra button is removed and the picker does nothing; the game's own restock button is never affected.
# Setting type: Boolean
# Default value: true
Enabled = true

## Log the full candidate list (name, rarity, price) on every restock and every time the picker is opened. Noisy; for troubleshooting only.
# Setting type: Boolean
# Default value: false
DebugLog = false

[Panel]

## Let the pick button create replenishment slots when the shop has none left unpurchased. A fresh shop starts with zero slots (the game only fills them when its own button is pressed), so without this the picker would have nowhere to write. Slots created this way cost no sapphire; the items in them are still bought with gold from the shop as usual. Turn this off to make the picker a pure re-chooser for slots a paid restock produced.
# Setting type: Boolean
# Default value: true
AllowCreateSlots = true

## Which UI root the cloned panel is drawn in: "Journal" (the root the journal panel itself lives in - keeps its CanvasScaler, rect and sorting order) or "Shop" (the shop panel's root - guaranteed to be visible while the shop is open). The open log line prints both roots, the one used, and each canvas's sorting order and CanvasGroup alpha, so a panel that comes up invisible can be fixed by flipping this one value.
# Setting type: String
# Default value: Journal
Parent = Journal

## Width of the slot column on the left, in the item page's own units. 0 (the default) takes about a quarter of the item frame's interior width, clamped to 72..40% of it, so the proportion survives a change of resolution. The column is the frame's left strip at full frame height; the items are indented past it with the grid layout group's own padding, so neither the frame nor any of the game's rects is moved. Every run prints the frame, the column, the tag band and the padding in local units AND in screen pixels, so this value can be tuned against a screenshot.
# Setting type: Single
# Default value: 0
SlotWidth = 0

## How many slot cards have to fit in the column. The cards are sized from this, so they always stay inside the frame instead of spilling over what is above them or off the bottom edge. A column holding more slots than this shrinks the cards so that all of them still fit.
# Setting type: Int32
# Default value: 2
SlotRows = 2

## Show a category filter row in the top strip of the item frame, to the right of the slot column. One tag per category present in the current pool, plus an "all" tag, and clicking the active one again clears it. Each tag is as wide as its own label needs, the labels are never wrapped, and the band is clipped by a RectMask2D - so the row can neither paint over the grid nor take clicks that belong to it. The grid is pushed below the band with the grid layout group's own padding.
# Setting type: Boolean
# Default value: true
FilterBar = true

## How many rows the category tags may use. A pool can carry more categories than the band has room for (charms alone have 21), so the label size is stepped down until the whole set fits in this many rows: nothing is squeezed into overlapping text and no filter is dropped. The tag icons are dropped first if they are what makes the set too wide. Raising this gives the tags more room and the grid correspondingly less.
# Setting type: Int32
# Default value: 3
FilterMaxRows = 3

## Close the picker with Escape. This is a fallback, not the main way out: the panel's own cloned close button is used when the journal has one. It cannot conflict with another mod's hotkey because Escape is not a feature key.
# Setting type: Boolean
# Default value: true
CloseWithEscape = true

## When a press lands on a candidate cell but the game's own raycast reports nothing there, pick that cell anyway. The panel knows where its cells are and can test the rectangle directly, so this turns 'the panel is open and clicking does nothing' into a working click. It never overrides a real hit: if something else is on top of the panel, that keeps the click.
# Setting type: Boolean
# Default value: true
FallbackClickHitTest = true

